<script>
    window.activeJudgeNames = []; // Make selected judges accessible in court.html
    document.querySelectorAll('.collapsible-container').forEach(function (container) {
        container.addEventListener('click', function () {
            const content = this.nextElementSibling;
            if (content.style.maxHeight && content.style.maxHeight !== "0px") {
                content.style.maxHeight = "0px";
            } else {
                content.style.maxHeight = content.scrollHeight + "px";
            }
            window.activeJudgeNames = [];
            // After clicking a collapsible judge, see which judges are open and get their names
            document.querySelectorAll('.collapsible-container').forEach(function (cont) {
                const contDetails = cont.nextElementSibling;
                if (contDetails.style.maxHeight && contDetails.style.maxHeight !== "0px") {
                    const activeJudgeName = cont.querySelector('h3')?.textContent.replace(" - Chief Justice", "");
                    if (activeJudgeName) {
                        window.activeJudgeNames.push(activeJudgeName);
                    }
                }
            });

            // Notify for radar_test.html
            const judgeEvent = new CustomEvent('judgeSelectionChanged', {
                detail: { judges: window.activeJudgeNames }
            });
            document.dispatchEvent(judgeEvent);
        });
    });
</script>
