{% load static %}

<!-- D3.js -->
<script src="https://d3js.org/d3.v7.min.js"></script>

<h3>Gantt Chart: {{ court_name }}</h3>

{{ gantt_data|json_script:"null" }}
<p id="gantt-data" style="display: none;">{{ gantt_data }}</p>

<div class="ganttContainer">
    <div class="ganttChart"></div>
</div>


<script src="{% static 'js/ganttChart.js' %}"></script>
<script>
    const ganttData = JSON.parse(document.getElementById("gantt-data").textContent);
    makeGanttChart(ganttData, ".ganttChart");
</script>
